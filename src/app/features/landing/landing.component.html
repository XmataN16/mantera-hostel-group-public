<div class="landing-container">
  <div class="parallax-scene">
    <div class="parallax-layer layer-bg">
      <div class="gradient-bg"></div>
    </div>
    <div class="parallax-layer layer-mid">
      <svg class="hotel-illustration" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
        <rect x="200" y="250" width="400" height="300" fill="rgba(255,255,255,0.1)" rx="20"/>
        <rect x="250" y="300" width="80" height="80" fill="rgba(255,255,255,0.2)" rx="10"/>
        <rect x="370" y="300" width="80" height="80" fill="rgba(255,255,255,0.2)" rx="10"/>
        <rect x="490" y="300" width="80" height="80" fill="rgba(255,255,255,0.2)" rx="10"/>
        <rect x="250" y="420" width="80" height="80" fill="rgba(255,255,255,0.2)" rx="10"/>
        <rect x="370" y="420" width="80" height="80" fill="rgba(255,255,255,0.2)" rx="10"/>
        <rect x="490" y="420" width="80" height="80" fill="rgba(255,255,255,0.2)" rx="10"/>
        <polygon points="400,150 250,250 550,250" fill="rgba(255,255,255,0.15)"/>
      </svg>
    </div>
    <div class="parallax-layer layer-front">
      <div class="decorative-elements">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
      </div>
    </div>
    <div class="parallax-layer layer-content">
      <div class="content-wrapper">
        <h1 class="main-title">
          <span class="title-line">Mantera Hotels</span>
          <span class="title-subtitle">Сеть отелей на побережье Чёрного моря</span>
        </h1>
        <p class="description">Комфорт, сервис и незабываемый отдых ждут вас</p>
        <div class="action-buttons">
          <!-- Неавторизованный гость: кнопки "Войти" и "Регистрация" -->
          <ng-container *ngIf="!authService.isAuthorizedGuest(); else loggedInTemplate">
            <button pButton label="Войти" icon="pi pi-sign-in" class="p-button-rounded p-button-lg" (click)="openLoginModal()"></button>
            <button pButton label="Регистрация" icon="pi pi-user-plus" class="p-button-rounded p-button-lg" (click)="openRegisterModal()"></button>
          </ng-container>
          <!-- Авторизованный гость: одна серая кнопка "Перейти в личный кабинет" -->
          <ng-template #loggedInTemplate>
            <button pButton label="Перейти в личный кабинет" icon="pi pi-user" class="p-button-rounded p-button-lg" severity="secondary" (click)="router.navigate(['/profile'])"></button>
          </ng-template>
        </div>
      </div>
    </div>
  </div>

  <p-dialog [(visible)]="displayAuthModal" [modal]="true" [style]="{ width: '450px' }" [closable]="true" [closeOnEscape]="true" header="">
    <ng-template pTemplate="header">
      <div class="modal-header">
        <h3>{{ isLoginMode ? 'Вход для гостей' : 'Регистрация гостя' }}</h3>
      </div>
    </ng-template>
    <div class="auth-modal-content">
      <!-- Форма входа (ТОЛЬКО НОМЕР ДОКУМЕНТА) -->
      <form *ngIf="isLoginMode" (ngSubmit)="onLogin()" class="auth-form">
        <div class="field">
          <label for="docNumber">Номер документа (Паспорт)</label>
          <input id="docNumber" type="text" pInputText [(ngModel)]="loginDocumentNumber" name="loginDocumentNumber" placeholder="Например: 4500 123456" class="w-full" required>
        </div>
        <div class="form-footer">
          <a class="forgot-password" (click)="isLoginMode = false">Нет аккаунта? Зарегистрироваться</a>
        </div>
        <button pButton type="submit" label="Войти" icon="pi pi-sign-in" [loading]="isLoading" class="w-full"></button>
      </form>
      <!-- Форма регистрации -->
      <form *ngIf="!isLoginMode" (ngSubmit)="onRegister()" class="auth-form">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
          <div class="field">
            <label>Фамилия *</label>
            <input type="text" pInputText [(ngModel)]="registerForm.lastName" name="lastName" class="w-full" required>
          </div>
          <div class="field">
            <label>Имя *</label>
            <input type="text" pInputText [(ngModel)]="registerForm.firstName" name="firstName" class="w-full" required>
          </div>
        </div>
        <div class="field">
          <label>Дата рождения *</label>
          <input type="date" pInputText [(ngModel)]="registerForm.birthDate" name="birthDate" class="w-full" required>
        </div>
        <div class="field">
          <label>Номер документа (Паспорт) *</label>
          <input type="text" pInputText [(ngModel)]="registerForm.documentNumber" name="documentNumber" class="w-full" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
          <div class="field">
            <label>Телефон</label>
            <input type="text" pInputText [(ngModel)]="registerForm.phone" name="phone" class="w-full">
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" pInputText [(ngModel)]="registerForm.email" name="email" class="w-full">
          </div>
        </div>
        <div class="form-footer">
          <a class="back-to-login" (click)="isLoginMode = true">Уже есть аккаунт? Войти</a>
        </div>
        <button pButton type="submit" label="Зарегистрироваться" icon="pi pi-user-plus" class="w-full" [loading]="isLoading"></button>
      </form>
    </div>
  </p-dialog>
</div>
